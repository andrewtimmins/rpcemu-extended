name: Build

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  linux-amd64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: bash setup-build-env.sh

      - name: Build and package (amd64, dynarec)
        run: |
          chmod +x build.sh setup-build-env.sh
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            ./build.sh --deb --zip
          else
            ./build.sh --zip
          fi

      - name: Smoke test binary
        run: |
          file releases/linux/amd64/rpcemu-recompiler | grep -i ELF
          ls -la releases/linux/amd64/
          # Actually execute it. --help and --list-machines run before any
          # wxWidgets/GTK initialisation, so they work with no display and catch
          # a binary that cannot start at all (bad link, missing library).
          ./releases/linux/amd64/rpcemu-recompiler --help
          ./releases/linux/amd64/rpcemu-recompiler --list-machines

      - name: Upload Linux amd64 release
        uses: actions/upload-artifact@v4
        with:
          name: rpcemu-linux-amd64
          path: |
            releases/linux/amd64/
            releases/linux/*.tar.gz
            releases/linux/amd64/*.deb
          if-no-files-found: error

  linux-arm64:
    # Native arm64 hosted runner (free for public repos). The ARM dynarec backend
    # does not exist, so arm64 uses the interpreter (--interpreter).
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: bash setup-build-env.sh

      - name: Build and package (arm64, interpreter)
        run: |
          chmod +x build.sh setup-build-env.sh
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            ./build.sh --interpreter --deb --zip
          else
            ./build.sh --interpreter --zip
          fi

      - name: Smoke test binary
        run: |
          file releases/linux/arm64/rpcemu-interpreter | grep -i ELF
          ls -la releases/linux/arm64/
          ./releases/linux/arm64/rpcemu-interpreter --help
          ./releases/linux/arm64/rpcemu-interpreter --list-machines

      - name: Upload Linux arm64 release
        uses: actions/upload-artifact@v4
        with:
          name: rpcemu-linux-arm64
          path: |
            releases/linux/arm64/
            releases/linux/*.tar.gz
            releases/linux/arm64/*.deb
          if-no-files-found: error

  windows-amd64:
    # Native Windows build with MinGW-w64 via MSYS2 (MINGW64). Ships the
    # recompiler (full-speed dynarec; the JIT supports the Windows x64 ABI).
    # Uses build-windows.sh (build.sh is apt/.deb-only).
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4

      - name: Set up MSYS2 / MinGW-w64
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-pkgconf
            mingw-w64-x86_64-wxwidgets3.2-msw
            mingw-w64-x86_64-SDL2
            mingw-w64-x86_64-libvncserver

      - name: Build and stage release (native MSYS2)
        run: |
          chmod +x build-windows.sh
          ./build-windows.sh --zip

      - name: Smoke test binary (PE executable)
        run: |
          ls -la releases/windows/amd64/
          # Windows ships the recompiler (full-speed dynarec; the JIT now
          # supports the Windows x64 ABI).
          file releases/windows/amd64/rpcemu-recompiler.exe | grep -i 'PE32'
          # Actually run it. This exercises the staged release as a user gets it,
          # so it also catches a DLL that build-windows.sh failed to copy
          # alongside the executable. --help and --list-machines return before
          # any wxWidgets initialisation.
          #
          # This binary is GUI-subsystem (no console window on double-click), so
          # it reports these messages in a dialog. A modal dialog would hang a
          # runner with no interactive desktop, so RPCEMU_NO_GUI_MESSAGES sends
          # the text to the standard streams instead - which is also what a
          # script on Windows would set. Both the output and the exit code are
          # checked: asserting on the exit code alone previously let a silent
          # --help pass.
          export RPCEMU_NO_GUI_MESSAGES=1
          ./releases/windows/amd64/rpcemu-recompiler.exe --help | grep -- '--machine'
          ./releases/windows/amd64/rpcemu-recompiler.exe --list-machines | grep -i 'Default'
          # An unknown machine must be reported, not silently ignored.
          ./releases/windows/amd64/rpcemu-recompiler.exe --machine no-such-machine > out.txt 2>&1 && rc=0 || rc=$?
          cat out.txt
          test "$rc" = "2" || { echo "expected exit 2 for an unknown machine, got $rc"; exit 1; }
          grep -qi 'not found' out.txt || { echo "expected 'not found' to be reported"; exit 1; }
          rm -f out.txt

      # Options must be spelled the same way on every platform, and an unknown
      # one must be reported by RPCEmu itself. wxWidgets used to answer both
      # "--foo" and DOS-style "/H" with its own error and usage dialogs, which
      # listed wx's options rather than RPCEmu's, appeared as a second unrelated
      # box, and would hang a runner with no interactive desktop.
      - name: Unknown options are rejected by RPCEmu, not wxWidgets
        timeout-minutes: 2
        run: |
          export RPCEMU_NO_GUI_MESSAGES=1
          # MSYS2 rewrites an argument that looks like a Unix path into a Windows
          # one, so a bare "/H" would reach the binary as "C:/msys64/H" - not a
          # switch, and it would fall through to launching the GUI and hang.
          # Exclude these arguments from that conversion so the test sends what
          # it means to send.
          export MSYS2_ARG_CONV_EXCL='*'
          exe=./releases/windows/amd64/rpcemu-recompiler.exe

          # A stray non-option argument is rejected too. RPCEmu takes none, and
          # ignoring one used to fall through to launching the GUI, which on a
          # runner with no display hangs until the job times out.
          for opt in --foo /H stray-argument; do
            "$exe" "$opt" > unknown.txt 2>&1 && rc=0 || rc=$?
            cat unknown.txt
            test "$rc" = "2" || { echo "$opt: expected exit 2, got $rc"; exit 1; }
            grep -qiE "unknown option|unexpected argument" unknown.txt || { echo "$opt: not reported"; exit 1; }
            # wx's own usage dialog names options RPCEmu does not document.
            if grep -qi "verbose" unknown.txt; then
              echo "$opt: wx's usage leaked into the message"
              exit 1
            fi
            rm -f unknown.txt
          done

      - name: Upload Windows amd64 release
        uses: actions/upload-artifact@v4
        with:
          name: rpcemu-windows-amd64
          path: |
            releases/windows/amd64/
            releases/windows/*.zip
          if-no-files-found: error

  macos-x86_64:
    # Free Intel (macos-13) runners are effectively unavailable, so build the
    # x86_64 slice (WITH the dynarec) on an Apple Silicon runner: Apple clang
    # cross-compiles to x86_64 natively via CMAKE_OSX_ARCHITECTURES, we just
    # need x86_64 libraries (from a Rosetta x86_64 Homebrew - the arm64 Homebrew
    # in /opt/homebrew can't provide them) and Rosetta 2 to run the JIT test.
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Install Rosetta 2
        run: softwareupdate --install-rosetta --agree-to-license

      - name: Install x86_64 Homebrew + dependencies
        run: |
          # A separate Intel Homebrew installs into /usr/local (the arm64
          # Homebrew lives in /opt/homebrew); both coexist. The install script
          # is downloaded by the outer shell, then executed under Rosetta so it
          # provisions the x86_64 tree.
          if [ ! -x /usr/local/bin/brew ]; then
            script="$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)"
            NONINTERACTIVE=1 arch -x86_64 /bin/bash -c "$script"
          fi
          arch -x86_64 /usr/local/bin/brew install cmake ninja pkg-config wxwidgets sdl2 libvncserver

      - name: Build x86_64 slice + test (Rosetta)
        run: |
          chmod +x build-macos.sh
          # Resolve wx-config / pkg-config / cmake from the x86_64 Homebrew
          # (/usr/local) so the slice links x86_64 libraries; clang emits x86_64
          # via CMAKE_OSX_ARCHITECTURES (set in build-macos.sh). The JIT test
          # binary is x86_64 and runs under Rosetta.
          export PATH="/usr/local/bin:$PATH"
          export PKG_CONFIG_PATH="/usr/local/lib/pkgconfig"
          ./build-macos.sh --arch x86_64

      - name: Upload x86_64 slice
        uses: actions/upload-artifact@v4
        with:
          name: macos-slice-x86_64
          # The staged tree, not just bin/: it carries this slice's bundled
          # dependencies, which only exist on this runner. The job that fuses the
          # slices installs no Homebrew packages of its own.
          path: build-mac-x86_64/appstage/
          if-no-files-found: error

  macos-arm64:
    # Apple Silicon runner: builds the arm64 slice. There is no ARM dynarec
    # backend, so arm64 uses the interpreter (RPCEMU_DYNAREC=OFF), mirroring the
    # Linux arm64 build. On Apple Silicon the x86_64 slice also runs via Rosetta.
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: brew install cmake ninja pkg-config wxwidgets sdl2 libvncserver

      - name: Build arm64 slice (interpreter) + test
        run: |
          chmod +x build-macos.sh
          ./build-macos.sh --arch arm64

      - name: Upload arm64 slice
        uses: actions/upload-artifact@v4
        with:
          name: macos-slice-arm64
          path: build-mac-arm64/appstage/
          if-no-files-found: error

  macos-universal:
    # Fuse the two per-arch slices into a universal binary and stage the release.
    needs: [macos-x86_64, macos-arm64]
    runs-on: macos-14
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Download x86_64 slice
        uses: actions/download-artifact@v4
        with:
          name: macos-slice-x86_64
          path: build-mac-x86_64/appstage

      - name: Download arm64 slice
        uses: actions/download-artifact@v4
        with:
          name: macos-slice-arm64
          path: build-mac-arm64/appstage

      - name: Fuse (lipo) + build RPCEmu.app + DMG
        run: |
          chmod +x build-macos.sh
          ./build-macos.sh --fuse --zip

      - name: Smoke test app bundle
        run: |
          APP=releases/macos/RPCEmu.app
          lipo -archs "$APP/Contents/MacOS/rpcemu"
          file "$APP/Contents/MacOS/rpcemu" | grep -i 'universal'
          test -f "$APP/Contents/Info.plist"
          codesign --verify --deep --strict "$APP"
          ls -la releases/macos/*.dmg
          # Actually run the fused binary, so a lipo or signing step that
          # produces something unloadable is caught here rather than by a user.
          #
          # macOS ships no timeout(1), and relying on the job-level
          # timeout-minutes as the backstop cost twenty minutes of runner time
          # the first time this test did not exit. So the watchdog is done here:
          # the invocation runs in the background and is killed if it outlives
          # its grace period, and either outcome reports rather than hangs.
          #
          # --help is expected to print usage and exit without ever calling
          # wxEntry(), so this also catches an argument-parsing path that does
          # not run in a bundled app - which would take --headless with it.
          run_help() {
            local out="help-$$.out" pid i
            "$@" --help >"$out" 2>&1 &
            pid=$!
            for i in $(seq 1 45); do
              kill -0 "$pid" 2>/dev/null || break
              sleep 1
            done
            if kill -0 "$pid" 2>/dev/null; then
              kill -9 "$pid" 2>/dev/null || true
              wait "$pid" 2>/dev/null || true
              echo "::error::'$* --help' did not exit within 45s (it should print usage and return)."
              echo "--- output before it was killed ---"
              cat "$out"
              return 1
            fi
            wait "$pid"
            local rc=$?
            cat "$out"
            if [ "$rc" -ne 0 ]; then
              echo "::error::'$* --help' exited $rc"
              return 1
            fi
            if ! grep -q '^Usage:' "$out"; then
              echo "::error::'$* --help' exited cleanly but printed no usage."
              return 1
            fi
          }
          # Probe the unfused, unbundled slice first, and do not fail on it. If
          # this one honours --help and the bundled binary below does not, then
          # the difference is the fusing or the bundle rather than the code;
          # if neither does, argument parsing is not reached on macOS at all.
          # Either way the next run says which, instead of leaving it to guesswork.
          if run_help build-mac-arm64/appstage/bin/rpcemu; then
            echo "note: the staged arm64 slice honours --help."
          else
            echo "note: the staged arm64 slice does not honour --help either, so this is not the bundle."
          fi
          run_help "$APP/Contents/MacOS/rpcemu"
          run_help arch -arm64 "$APP/Contents/MacOS/rpcemu"
          # The x86_64 slice needs Rosetta 2, which this job does not install
          # (only the x86_64 build job does). Check for it rather than assuming,
          # since invoking arch -x86_64 without it can stall.
          if arch -x86_64 /usr/bin/true >/dev/null 2>&1; then
            run_help arch -x86_64 "$APP/Contents/MacOS/rpcemu"
          else
            echo "Note: skipping the x86_64 slice check, Rosetta 2 is not installed on this runner."
          fi

      - name: Upload macOS universal release
        uses: actions/upload-artifact@v4
        with:
          name: rpcemu-macos-universal
          path: |
            releases/macos/*.dmg
            releases/macos/*.tar.gz
          if-no-files-found: error

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [linux-amd64, linux-arm64, windows-amd64, macos-universal]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: upload

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            upload/**/*.deb
            upload/**/*.dmg
            upload/**/*.tar.gz
            upload/**/*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
