# Build, test and release RPCEmu Extended.
#
# The jobs form a chain of gates, each one earning the right to start the next:
#
#   release-preflight        tags only; does the tag match VERSION, and do its
#         |                  release notes exist? Skipped on every other ref.
#         v
#   sanitisers   interface-docs   the checks: undefined behaviour and the test
#         |             |         suite, and the API reference still building.
#         +------+------+
#                v
#            build-gate          one answer to "are the checks clear?"
#                |
#   +------------+------------+---------------+---------------+--------------+
#   |            |            |               |               |              |
#   v            v            v               v               v              v
#   linux-amd64  linux-arm64  windows-amd64   windows-arm64   macos-x86_64   macos-arm64
#         |            |            |               |               |             |
#         +-----+------+            +-------+-------+               +------+------+
#               v                           v                              v
#             linux                      windows                    macos-universal
#               |                           |                              |
#               +---------------------------+------------------------------+
#                                           v
#                                        release   tags only; publishes the assets
#                                           |
#                                           v
#                                        notify    pushes only; posts to Slack
#
# Each platform ends in one job so that the row above it can be read as "did
# Linux pass?" rather than as six separate answers, and so a branch protection
# rule has one check per platform to require. linux, windows and macos-universal
# are that job; macos-universal is also the one that does the fusing.
#
# Before editing: a skipped job skips the whole chain behind it, not just the
# next job along, and release-preflight is skipped on every ref that is not a
# tag. So every job downstream of it reads
#
#     if: always() && <what it actually requires>
#
# where always() stops the inherited skip and the rest is the real condition.
# release is the exception, running on tags alone.

name: Build

on:
  push:
    # 1.x is the maintenance branch for the 1.1.x series, which is still
    # supported, so a push there has to build and test exactly as main does.
    # Without it named here a fix on that branch would be published untested.
    branches: [main, 1.x]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Push again while a run is still going and the first one is now building a
# commit nobody is waiting on, so stop it and let the new one have the runners.
# Each ref gets its own group, so a push to main never cancels a pull request.
#
# Tags are the exception. A tag run is the one that publishes a release, and it
# uploads the assets one at a time, so cancelling it half way leaves a release
# carrying some of its files - worse than the runner time it saves. Nothing
# supersedes a tag anyway, each one being its own ref, so there is nothing to
# gain by cancelling it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  # What a tag has to get right before anything is built: it agrees with VERSION,
  # and its release notes exist. Disagreeing publishes a release whose contents
  # claim to be something else; missing notes cannot be written afterwards.
  #
  # Tags only, so this is skipped on a branch or a pull request - and everything
  # behind it treats that skip as permission to continue.
  release-preflight:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-slim
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-tags: true

      - name: The tag and the VERSION file must agree
        run: |
          tag="${GITHUB_REF#refs/tags/v}"
          file="$(tr -d ' \t\r\n' < VERSION)"
          if [ "$tag" != "$file" ]; then
            echo "::error::tag v$tag does not match VERSION ($file)"
            echo "Update VERSION to $tag, or tag v$file instead."
            exit 1
          fi
          echo "tag v$tag matches VERSION"

      # Hand-written notes, required rather than generated: most work lands as
      # direct commits to main, which a generated list of merged pull requests
      # would not describe.
      - name: The release notes must exist
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          notes="docs/release-notes/${tag}.md"
          if [ ! -s "$notes" ]; then
            echo "::error::$notes is missing or empty"
            echo "Write the notes before tagging. Group them as New features /"
            echo "Fixes / Under the hood, say honestly what is verified and what"
            echo "is not, and end with a compare link to the previous release."
            echo "See docs/release-notes/README.md."
            exit 1
          fi
          echo "found $notes ($(wc -l < "$notes") lines)"

  # Everything else asks whether the emulator does the right thing. This asks
  # whether it does it legitimately - whether the C it is written in is doing
  # what its author believed. An emulator is mostly arithmetic on addresses the
  # guest chose, so the two questions have different answers more often here than
  # in ordinary software: the first time this was run it found a shift by 32 on
  # every word-aligned load and a signed overflow on every palette update, both
  # of which had produced the right answer on every compiler the project has ever
  # been built with, and neither of which any test could have caught.
  #
  # Linux only, and that is a real limit rather than an oversight: it is the same
  # C on all three platforms, so a fault found here is a fault everywhere, but a
  # platform's own code (the Win32 and Cocoa paths) is not covered. Noted in
  # docs/testing.md rather than left to be discovered.
  #
  # It also fetches the ROM the boot below needs, which seeds the cache every
  # other job reads: this job finishes before build-gate lets any build start, so
  # by then the entry exists and the five platform jobs cannot race to write it.
  sanitisers:
    needs: release-preflight
    if: always() && needs.release-preflight.result != 'failure'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-tags: true

      - name: Install dependencies
        timeout-minutes: 4
        run: bash setup-build-env.sh

      # The interpreter, not the recompiler: ASan instruments compiled code, and
      # the recompiler writes its own at run time into a page it maps itself, so
      # the sanitisers cannot see it. The JIT is covered instead by the
      # differential tests that check it against the interpreter.
      #
      # -fno-sanitize-recover=all makes the first report fatal; without it a fault
      # in the emulation loop prints thousands of times and still exits 0.
      # GhostPDL is off - third-party, reached only by printing.
      - name: Configure with ASan and UBSan
        run: |
          cmake -S . -B build-san \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DRPCEMU_DYNAREC=OFF \
            -DRPCEMU_ENABLE_GHOSTPDL=OFF \
            -DCMAKE_C_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer -fno-sanitize-recover=all" \
            -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer -fno-sanitize-recover=all" \
            -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"

      - name: Build
        timeout-minutes: 4
        run: cmake --build build-san -j"$(nproc)"

      - name: Unit tests under the sanitisers
        timeout-minutes: 3
        env:
          # Leak checking is off. The emulator holds its guest RAM, ROM and
          # framestore for the life of the process and frees none of it on the
          # way out, which is deliberate and which LeakSanitizer would report as
          # hundreds of megabytes of leaks. Turning it on wants those exits
          # tidied first; it is not a reason to have no sanitiser job at all.
          ASAN_OPTIONS: detect_leaks=0
          UBSAN_OPTIONS: print_stacktrace=1
        run: bash tests/run-ctest.sh build-san sanitisers

      - name: Cache the RISC OS ROM
        uses: actions/cache@v6
        with:
          path: ci-rom
          key: rpcemu-rom-stable-v1

      # The unit tests reach a codec, a parser and a register file. A boot reaches
      # the CPU core, the MMU, IOMD, VIDC, the IDE and floppy controllers, HostFS
      # and the video path, with a real operating system driving them - which is
      # where the interesting undefined behaviour has actually been.
      - name: Fetch a ROM for the boot
        run: |
          set -eu
          export RPCEMU_DATADIR="$RUNNER_TEMP/rpcemu-san-data"
          export RPCEMU_NO_GUI_MESSAGES=1
          export ASAN_OPTIONS=detect_leaks=0
          mkdir -p "$RPCEMU_DATADIR" ci-rom
          cp -r default configs "$RPCEMU_DATADIR/"
          if ! ls ci-rom/ROM* >/dev/null 2>&1; then
            build-san/bin/rpcemu-interpreter --fetch-riscos --no-disc --accept-licence
            cp "$RPCEMU_DATADIR"/roms/ROM* ci-rom/
          fi
          mkdir -p "$RPCEMU_DATADIR/roms"
          cp ci-rom/ROM* "$RPCEMU_DATADIR/roms/"

      # --screen-check advisory: an instrumented interpreter is tens of times
      # slower than the recompiler a user runs, so how far RISC OS gets in a fixed
      # time measures the runner rather than the code. The verdict here is what
      # the sanitisers said; whether the desktop is reached is judged by the four
      # ordinary boot tests, on every platform, on real builds.
      - name: Boot under the sanitisers
        timeout-minutes: 3
        env:
          ASAN_OPTIONS: detect_leaks=0
          UBSAN_OPTIONS: print_stacktrace=1
        run: |
          python3 tests/boot_smoke.py \
            --binary build-san/bin/rpcemu-interpreter \
            --datadir "$RUNNER_TEMP/rpcemu-san-data" \
            --boot-timeout 300 --settle 60 \
            --screen-check advisory \
            --abort-check advisory \
            --save sanitiser-boot.png

      - name: Upload the boot screenshot
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: sanitiser-boot
          path: sanitiser-boot.png
          archive: false
          if-no-files-found: ignore

  # Render the interface documentation under docs/prminxml/.
  #
  # These are PRM-in-XML: the format the RISC OS Programmer's Reference Manuals
  # are written in, and the right one for an interface somebody else has to
  # implement against, because it fixes the register contract in a structured
  # form rather than in prose. docs/ is otherwise Markdown, which stays the
  # right choice for notes about how this repository works; the distinction is
  # between describing an interface and describing an implementation.
  #
  # The HTML is a release asset. Somebody writing a host-side implementation of
  # one of these interfaces is not necessarily building the emulator, and should
  # not have to check out the tree and install a toolchain to read what the
  # interface does.
  #
  # docs/prminxml/index.xml names the chapters, their order and where the output
  # goes, so this job does not: adding a chapter is a change to that file alone.
  # The indexed build renders every chapter as well as the contents page and the
  # generated SWI index, which is what lets a reader find a call without already
  # knowing which interface it belongs to.
  interface-docs:
    needs: release-preflight
    if: always() && needs.release-preflight.result != 'failure'
    runs-on: ubuntu-latest
    timeout-minutes: 6
    outputs:
      leafname: ${{ steps.package.outputs.leafname }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-tags: true

      # No style: input. index.xml sets its own page and index CSS variants, and
      # style: would prepend a second set of them.
      - name: Render the host interfaces manual
        uses: gerph/riscos-prminxml-action@v1
        with:
          files: docs/prminxml/index.xml
          format: index
          output: prm-output
          log-directory: prm-output/indexed/logs

      # Named the way build.sh names the binaries, so the archive and the
      # executables beside it in a release agree: VERSION on a release tag, and
      # VERSION with the commit appended anywhere else. Without the second half a
      # docs archive built from a branch is named as though it were the release
      # itself. The same logic lives in build.sh's get_version and in
      # CMakeLists.txt; release-preflight has already insisted VERSION and the tag
      # agree before any release is published.
      - name: Package the documentation
        id: package
        run: |
          if [ -s VERSION ]; then
            version="$(tr -d ' \t\r\n' < VERSION)"
            if ! git describe --tags --exact-match --match 'v[0-9]*' >/dev/null 2>&1; then
              version="$version-g$(git rev-parse --short HEAD)"
            fi
          else
            version="$(git rev-parse --short HEAD)"
          fi
          leafname="rpcemu-interface-docs-$version.zip"
          # pages/ only. The rest of what the indexed build leaves behind - its
          # logs, temporary files, per-chapter headers and index data - is build
          # working, and a reader opening the release asset should find the
          # manual rather than have to pick it out. The XML sources are inside
          # pages/ beside their HTML, and are kept: they are the machine-readable
          # form of the same thing.
          pages=prm-output/indexed/pages
          if [ ! -s "$pages/index.html" ]; then
            echo "::error::the documentation build produced no manual"
            exit 1
          fi
          ( cd "$pages" && zip -q9r "$OLDPWD/$leafname" . )
          echo "leafname=$leafname" >> "$GITHUB_OUTPUT"
          ls -l "$leafname"

      - uses: actions/upload-artifact@v7
        with:
          name: rpcemu-interface-docs
          path: ${{ steps.package.outputs.leafname }}
          if-no-files-found: error

  # One answer to "are the checks clear?". The platform builds behind it say
  # needs: build-gate rather than each repeating the same pair of result tests,
  # and a branch protection rule has one check to require rather than one per
  # check. Does no work, so it takes the smallest runner.
  #
  # Not in notify's needs: it reports which job failed, and would say build-gate
  # where it currently names the check that actually broke.
  # Does what the README tells a user to run still work, and does the server
  # start afterwards. Its own job because it needs nothing the builds produce,
  # and because a Python packaging change turning a platform build red would
  # name the wrong culprit.
  #
  # fail-fast is off because the three legs answer different questions - bash
  # against PowerShell, three Pythons, two venv layouts. Letting them all report
  # separates "a package changed under us" from "one script broke".
  mcp-server:
    needs: release-preflight
    if: always() && needs.release-preflight.result != 'failure'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v7

      # The runner's own Python, not a pinned one: what a user has is what this
      # should be testing.
      - name: Which Python
        shell: bash
        run: python3 --version || python --version

      # Windows drives the PowerShell script, because that is what a Windows
      # user runs: a python.org install and PowerShell, not the MSYS2 shell the
      # Windows *build* job uses.
      - name: Set up and start (Linux and macOS)
        if: runner.os != 'Windows'
        run: bash tests/mcp_smoke.sh

      - name: Set up and start (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $env:RPCEMU_MCP_VENV = Join-Path $env:RUNNER_TEMP 'mcp-smoke-venv'

          & .\tools\mcp\setup-mcp-env.ps1
          if ($LASTEXITCODE -ne 0) { throw "the setup script failed" }

          $py = Join-Path $env:RPCEMU_MCP_VENV 'Scripts\python.exe'
          if (-not (Test-Path $py)) { throw "no interpreter at $py" }

          # The same probe the shell script runs, from a file rather than -c:
          # quoting Python through YAML and PowerShell both is a way to break
          # this without touching it.
          & $py tests/mcp_probe.py tools/mcp/rpcemu_mcp.py
          if ($LASTEXITCODE -ne 0) { throw "the server did not load" }

  # The MCP server is in here because the releases ship it (build.sh and the
  # other two stage tools/mcp into every package): a broken one is a broken
  # release, and this is the gate that stops one going out.
  build-gate:
    needs: [sanitisers, interface-docs, mcp-server]
    if: always() && needs.sanitisers.result == 'success' && needs['interface-docs'].result == 'success' && needs['mcp-server'].result == 'success'
    runs-on: ubuntu-slim
    timeout-minutes: 3
    steps:
      - run: echo "The sanitisers, the interface documentation and the MCP server are clear."

  # The two Linux builds are written out as two jobs rather than folded into one
  # matrix. They are nearly the same job and a matrix does remove the
  # duplication, but it is drawn in the Actions graph as a container of its own
  # headed "Matrix: linux", and it reports a check per leg and none for the pair.
  # Windows and macOS are each a pair of ordinary jobs meeting at an aggregate,
  # so Linux is written the same way: the graph reads alike across all three, and
  # each platform offers one check for a branch protection rule to require.
  #
  # Both architectures get the recompiler, each with its own backend. Three steps
  # run on amd64 alone and each says why where it stands.
  linux-amd64:
    needs: build-gate
    if: always() && needs.build-gate.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-tags: true

      # --podules adds the ARM binutils, so this job builds the guest modules
      # under riscos-progs/ as well as the emulator. Without them build.sh says
      # "Guest ROMs: skipped - using the committed ones" and carries on, which
      # meant no CI job had ever assembled a single one of them.
      #
      # amd64 alone; the check below says why.
      - name: Install dependencies
        timeout-minutes: 3
        run: bash setup-build-env.sh --podules

      # The assembled guest modules are committed, so a user needs no
      # cross-assembler - which makes "edited the source, forgot to rebuild" a
      # silent failure. This catches it.
      #
      # Must run before the build: build.sh rebuilds these and copies them over
      # the committed images, so comparing afterwards compares a file with itself.
      # amd64 only - the modules are ARM binaries, identical whatever host builds
      # them.
      - name: Guest modules match their sources
        run: bash tests/check-guest-modules.sh

      # Piped through tee so the compiler's output can be examined afterwards.
      # pipefail so a failed build still fails the step rather than being masked
      # by tee's exit status.
      - name: Build and package (amd64, dynarec)
        timeout-minutes: 3
        run: |
          set -o pipefail
          chmod +x build.sh setup-build-env.sh
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            ./build.sh --deb --zip 2>&1 | tee build.log
          else
            ./build.sh --zip 2>&1 | tee build.log
          fi

      # A warning in code this project maintains fails the build. Done here
      # rather than with -Werror in CMake, so that a new compiler release cannot
      # stop a user building from source - see the comment in the script.
      # Only amd64: it is the same C everywhere, and a full clean build is
      # needed for the compiler to say anything at all about a file it would
      # otherwise skip.
      - name: No new compiler warnings
        run: bash tests/check-warnings.sh build.log

      - name: Smoke test binary
        run: |
          file releases/linux/amd64/rpcemu-recompiler | grep -i ELF
          ls -la releases/linux/amd64/
          # Actually execute it. These paths run before any wxWidgets/GTK
          # initialisation, so they work with no display and catch a binary that
          # cannot start at all (bad link, missing library). The same script
          # runs on every platform, so the CLI is checked identically.
          bash tests/cli_smoke.sh releases/linux/amd64/rpcemu-recompiler

      # A full boot over the built-in VNC server. Everything above stops at "the
      # binary starts and parses its arguments"; this exercises the CPU, memory,
      # VIDC, ROM loading and the VNC server itself. The machine is seeded with a
      # !Boot that runs Desktop, and the check asks whether the screen has a
      # desktop's range of colour rather than matching a reference image, so
      # cosmetic changes cannot fail it.
      #
      # RPCEmu ships no ROM, so one is fetched with the emulator's own downloader
      # - which also exercises that path, a different HTTP stack per platform.
      #
      # RPCEMU_DATADIR puts the ROM and the test machine under RUNNER_TEMP, so
      # every write stays out of the release about to be uploaded while the
      # binary still finds its resources beside itself.
      - name: Cache the RISC OS ROM
        uses: actions/cache@v6
        with:
          path: ci-rom
          key: rpcemu-rom-stable-v1
      - name: Fetch a ROM for the boot test
        run: |
          set -eu
          export RPCEMU_DATADIR="$RUNNER_TEMP/rpcemu-data"
          export RPCEMU_NO_GUI_MESSAGES=1
          mkdir -p "$RPCEMU_DATADIR" ci-rom
          cp -r default configs "$RPCEMU_DATADIR/"
          if ! ls ci-rom/ROM* >/dev/null 2>&1; then
            releases/linux/amd64/rpcemu-recompiler --fetch-riscos --no-disc --accept-licence
            cp "$RPCEMU_DATADIR"/roms/ROM* ci-rom/
          fi
          mkdir -p "$RPCEMU_DATADIR/roms"
          cp ci-rom/ROM* "$RPCEMU_DATADIR/roms/"
          ls -la "$RPCEMU_DATADIR/roms/"

      - name: Headless boot smoke test
        timeout-minutes: 3
        run: |
          python3 tests/boot_smoke.py \
            --binary releases/linux/amd64/rpcemu-recompiler \
            --datadir "$RUNNER_TEMP/rpcemu-data" \
            --abort-check require \
            --save vnc-smoke-linux-amd64.png

      - name: Upload the boot screenshot
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: vnc-smoke-linux-amd64
          path: vnc-smoke-linux-amd64.png
          # A single PNG: skip the zip so it can be viewed from the run page
          # directly. "archive: false" allows one file only, which this is.
          archive: false
          if-no-files-found: ignore

      - name: Upload Linux amd64 release
        uses: actions/upload-artifact@v7
        with:
          name: rpcemu-linux-amd64
          path: |
            releases/linux/amd64/
            releases/linux/*.tar.gz
            releases/linux/amd64/*.deb
          if-no-files-found: error

  # The recompiler, as of 1.1.15. It was the interpreter while the AArch64 backend
  # did not boot (issue #30); it does, and this runner is real arm64 hardware with
  # a headless boot test, so the switch is proved here rather than hoped for.
  # Otherwise the same build as amd64, minus the three checks that only need
  # running once against the same C.
  linux-arm64:
    needs: build-gate
    if: always() && needs.build-gate.result == 'success'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-tags: true

      - name: Install dependencies
        timeout-minutes: 3
        run: bash setup-build-env.sh

      - name: Build and package (arm64, recompiler)
        timeout-minutes: 3
        run: |
          set -o pipefail
          chmod +x build.sh setup-build-env.sh
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            ./build.sh --deb --zip 2>&1 | tee build.log
          else
            ./build.sh --zip 2>&1 | tee build.log
          fi

      - name: Smoke test binary
        run: |
          file releases/linux/arm64/rpcemu-recompiler | grep -i ELF
          ls -la releases/linux/arm64/
          # See the amd64 job: runs before any wxWidgets/GTK initialisation, so
          # it needs no display and catches a binary that cannot start at all.
          bash tests/cli_smoke.sh releases/linux/arm64/rpcemu-recompiler

      # See the amd64 job for what this proves and why the ROM is fetched rather
      # than shipped.
      - name: Cache the RISC OS ROM
        uses: actions/cache@v6
        with:
          path: ci-rom
          key: rpcemu-rom-stable-v1
      - name: Fetch a ROM for the boot test
        run: |
          set -eu
          export RPCEMU_DATADIR="$RUNNER_TEMP/rpcemu-data"
          export RPCEMU_NO_GUI_MESSAGES=1
          mkdir -p "$RPCEMU_DATADIR" ci-rom
          cp -r default configs "$RPCEMU_DATADIR/"
          if ! ls ci-rom/ROM* >/dev/null 2>&1; then
            releases/linux/arm64/rpcemu-recompiler --fetch-riscos --no-disc --accept-licence
            cp "$RPCEMU_DATADIR"/roms/ROM* ci-rom/
          fi
          mkdir -p "$RPCEMU_DATADIR/roms"
          cp ci-rom/ROM* "$RPCEMU_DATADIR/roms/"
          ls -la "$RPCEMU_DATADIR/roms/"

      - name: Headless boot smoke test
        timeout-minutes: 3
        run: |
          python3 tests/boot_smoke.py \
            --binary releases/linux/arm64/rpcemu-recompiler \
            --datadir "$RUNNER_TEMP/rpcemu-data" \
            --abort-check require \
            --save vnc-smoke-linux-arm64.png

      - name: Upload the boot screenshot
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: vnc-smoke-linux-arm64
          path: vnc-smoke-linux-arm64.png
          archive: false
          if-no-files-found: ignore

      - name: Upload Linux arm64 release
        uses: actions/upload-artifact@v7
        with:
          name: rpcemu-linux-arm64
          path: |
            releases/linux/arm64/
            releases/linux/*.tar.gz
            releases/linux/arm64/*.deb
          if-no-files-found: error

  linux:
    needs: [linux-amd64, linux-arm64]
    if: always() && needs.linux-amd64.result == 'success' && needs.linux-arm64.result == 'success'
    runs-on: ubuntu-slim
    timeout-minutes: 3
    steps:
      - run: echo "Linux amd64 and arm64 both built and passed their tests."

  windows-amd64:
    needs: build-gate
    if: always() && needs.build-gate.result == 'success'
    # Native Windows build with MinGW-w64 via MSYS2 (MINGW64). Ships the
    # recompiler (full-speed dynarec; the JIT supports the Windows x64 ABI).
    # Uses build-windows.sh (build.sh is apt/.deb-only).
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-tags: true

      - name: Set up MSYS2 / MinGW-w64
        timeout-minutes: 5
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            git
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-pkgconf
            mingw-w64-x86_64-wxwidgets3.2-msw
            mingw-w64-x86_64-SDL2
            mingw-w64-x86_64-libvncserver
            mingw-w64-x86_64-libusb

      - name: Build and stage release (native MSYS2)
        timeout-minutes: 6
        run: |
          chmod +x build-windows.sh
          ./build-windows.sh --zip

      - name: Smoke test binary (PE executable)
        run: |
          ls -la releases/windows/amd64/
          # Windows ships the recompiler (full-speed dynarec; the JIT now
          # supports the Windows x64 ABI).
          file releases/windows/amd64/rpcemu-recompiler.exe | grep -i 'PE32'
          # The same checks the other platforms run. This also exercises the
          # staged release as a user gets it, so it catches a DLL that
          # build-windows.sh failed to copy alongside the executable.
          bash tests/cli_smoke.sh releases/windows/amd64/rpcemu-recompiler.exe

      # Windows only: wxWidgets used to accept DOS-style "/switch" here and
      # answer an unrecognised one with its own error and usage dialogs, which
      # listed wx's options rather than RPCEmu's and would hang a runner with no
      # interactive desktop. Long options are the interface on every platform,
      # so "/H" must be reported like any other unknown option.
      - name: DOS-style switches are rejected
        timeout-minutes: 2
        run: |
          export RPCEMU_NO_GUI_MESSAGES=1
          # MSYS2 rewrites an argument that looks like a Unix path into a Windows
          # one, so a bare "/H" would arrive as "C:/msys64/H". Exclude it from
          # that conversion so the test sends what it means to send.
          export MSYS2_ARG_CONV_EXCL='*'
          exe=./releases/windows/amd64/rpcemu-recompiler.exe

          "$exe" /H > slash.txt 2>&1 && rc=0 || rc=$?
          cat slash.txt
          test "$rc" = "2" || { echo "expected exit 2 for /H, got $rc"; exit 1; }
          grep -qi "unknown option" slash.txt || { echo "/H was not reported as an unknown option"; exit 1; }
          # wx's own usage names options RPCEmu does not document.
          if grep -qi "verbose" slash.txt; then
            echo "wx's usage leaked into the message"
            exit 1
          fi
          rm -f slash.txt

      # A full boot over the built-in VNC server. Everything above stops at "the
      # binary starts and parses its arguments"; this exercises the CPU, memory,
      # VIDC, ROM loading and the VNC server itself. The machine is seeded with a
      # !Boot that runs Desktop, and the check asks whether the screen has a
      # desktop's range of colour rather than matching a reference image, so
      # cosmetic changes cannot fail it.
      #
      # RPCEmu ships no ROM, so one is fetched with the emulator's own downloader
      # - which also exercises that path, a different HTTP stack per platform.
      #
      # Cached, so RISC OS Open are not asked for the same file every push.
      # RPCEMU_DATADIR puts the ROM and the test machine under RUNNER_TEMP, so
      # every write stays out of the release about to be uploaded while the
      # binary still finds its resources beside itself.
      - name: Cache the RISC OS ROM
        uses: actions/cache@v6
        with:
          path: ci-rom
          key: rpcemu-rom-stable-v1
      - name: Fetch a ROM for the boot test
        run: |
          set -eu
          # The one platform where the two cannot be the same string. This shell
          # needs the MSYS2 form of the path, while the executable is a native
          # Windows program and needs the Windows form, so RUNNER_TEMP (which
          # arrives as D:\a\_temp) goes through cygpath both ways.
          data="$(cygpath -u "$RUNNER_TEMP")/rpcemu-data"
          export RPCEMU_DATADIR="$(cygpath -w "$data")"
          export RPCEMU_NO_GUI_MESSAGES=1
          mkdir -p "$data" ci-rom
          cp -r default configs "$data/"
          if ! ls ci-rom/ROM* >/dev/null 2>&1; then
            releases/windows/amd64/rpcemu-recompiler.exe --fetch-riscos --no-disc --accept-licence
            cp "$data"/roms/ROM* ci-rom/
          fi
          mkdir -p "$data/roms"
          cp ci-rom/ROM* "$data/roms/"
          ls -la "$data/roms/"

      - name: Headless boot smoke test
        timeout-minutes: 3
        run: |
          python3 tests/boot_smoke.py \
            --binary releases/windows/amd64/rpcemu-recompiler.exe \
            --datadir "$(cygpath -u "$RUNNER_TEMP")/rpcemu-data" \
            --abort-check require \
            --save vnc-smoke-windows-amd64.png

      - name: Upload the boot screenshot
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: vnc-smoke-windows-amd64
          path: vnc-smoke-windows-amd64.png
          # A single PNG: skip the zip so it can be viewed from the run page
          # directly. "archive: false" allows one file only, which this is.
          archive: false
          if-no-files-found: ignore

      - name: Upload Windows amd64 release
        uses: actions/upload-artifact@v7
        with:
          name: rpcemu-windows-amd64
          path: |
            releases/windows/amd64/
            releases/windows/*.zip
          if-no-files-found: error

  windows-arm64:
    needs: build-gate
    if: always() && needs.build-gate.result == 'success'
    # Native Windows-on-ARM build, asked for by users running RPCEmu on ARM
    # laptops. MSYS2's CLANGARM64 environment: clang reports
    # aarch64-w64-windows-gnu and file(1) calls the output "PE32+ ... ARM64", so
    # this is a native binary and not the amd64 one under emulation.
    #
    # The INTERPRETER, deliberately (build-windows.sh defaults to it here). The
    # AArch64 dynarec is not shipped on any platform yet, and Windows on ARM adds
    # its own questions to it - x18 is reserved as the TEB pointer, and cache
    # maintenance wants FlushInstructionCache rather than the EL0 dc/ic the
    # backend uses. Shipping an unproven JIT on a new platform would make both
    # harder to judge.
    #
    # Worth knowing before this is offered to anyone as "the fast one": Windows on
    # ARM already runs our amd64 build under Prism emulation WITH the x86-64
    # recompiler, so an emulated build with a JIT may well beat a native build
    # with the interpreter. Which is quicker is a question for real hardware, and
    # this job exists so there is something to measure.
    #
    # Slower than the amd64 job for a mundane reason: MSYS2's own runtime is
    # x86-64, so the build tools themselves run emulated. Setting up the
    # environment alone takes about four minutes.
    runs-on: windows-11-arm
    timeout-minutes: 20
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-tags: true

      - name: Set up MSYS2 / CLANGARM64
        timeout-minutes: 11
        uses: msys2/setup-msys2@v2
        with:
          msystem: CLANGARM64
          update: true
          install: >-
            git
            mingw-w64-clang-aarch64-toolchain
            mingw-w64-clang-aarch64-cmake
            mingw-w64-clang-aarch64-ninja
            mingw-w64-clang-aarch64-pkgconf
            mingw-w64-clang-aarch64-wxwidgets3.2-msw
            mingw-w64-clang-aarch64-SDL2
            mingw-w64-clang-aarch64-libvncserver
            mingw-w64-clang-aarch64-libusb

      - name: Build and stage release (arm64, interpreter)
        timeout-minutes: 8
        run: |
          chmod +x build-windows.sh
          ./build-windows.sh --zip

      # The architecture is the whole point of this job, so it is asserted rather
      # than admired: a toolchain misconfiguration that produced x86-64 here would
      # otherwise pass every other check in this file.
      - name: Smoke test binary (native ARM64 PE)
        run: |
          ls -la releases/windows/arm64/
          exe=releases/windows/arm64/rpcemu-interpreter.exe
          file "$exe"
          file "$exe" | grep -qi 'aarch64\|arm64' \
            || { echo "not a native ARM64 binary"; exit 1; }
          # Runs the staged release as a user receives it, so a runtime DLL the
          # bundler failed to copy is caught here rather than by them. clang's
          # runtime differs from GCC's - libc++ and libunwind rather than
          # libstdc++ and libgcc - which is exactly the sort of thing to check on
          # a new platform.
          bash tests/cli_smoke.sh "$exe"

      # The ROM the boot test needs, fetched with the emulator's own downloader -
      # which on Windows means WinHTTP, and this is the first time that has run on
      # ARM64. Cached so RISC OS Open are not asked for the same file every push;
      # the key is shared with the other jobs because it is the same ROM.
      - name: Cache the RISC OS ROM
        uses: actions/cache@v6
        with:
          path: ci-rom
          key: rpcemu-rom-stable-v1

      - name: Fetch a ROM for the boot test
        run: |
          set -eu
          # As in the amd64 job: this shell wants the MSYS2 form of the path while
          # the executable is a native Windows program and wants the Windows form.
          data="$(cygpath -u "$RUNNER_TEMP")/rpcemu-data"
          export RPCEMU_DATADIR="$(cygpath -w "$data")"
          export RPCEMU_NO_GUI_MESSAGES=1
          mkdir -p "$data" ci-rom
          cp -r default configs "$data/"
          if ! ls ci-rom/ROM* >/dev/null 2>&1; then
            releases/windows/arm64/rpcemu-interpreter.exe --fetch-riscos --no-disc --accept-licence
            cp "$data"/roms/ROM* ci-rom/
          fi
          mkdir -p "$data/roms"
          cp ci-rom/ROM* "$data/roms/"
          ls -la "$data/roms/"

      # The test that answers the question the rest of this job cannot: does it
      # actually emulate a Risc PC on Windows on ARM? It boots a real machine with
      # a real ROM and checks over the built-in VNC server that RISC OS drew
      # something, which exercises the CPU core, memory, VIDC, ROM loading and
      # libvncserver together - all of it built by a compiler and for an
      # architecture this project has never used before.
      #
      # Longer timeout than the amd64 job gets: this is the interpreter rather
      # than the recompiler. It is now the only build that is, the other two arm64
      # platforms having moved to the recompiler in 1.1.15 - see build-windows.sh
      # for what is still outstanding on Windows on ARM specifically.
      - name: Headless boot smoke test
        timeout-minutes: 3
        run: |
          python3 tests/boot_smoke.py \
            --binary releases/windows/arm64/rpcemu-interpreter.exe \
            --datadir "$(cygpath -u "$RUNNER_TEMP")/rpcemu-data" \
            --abort-check require \
            --save vnc-smoke-windows-arm64.png

      - name: Upload the boot screenshot
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: vnc-smoke-windows-arm64
          path: vnc-smoke-windows-arm64.png
          archive: false
          if-no-files-found: ignore

      - name: Upload arm64 build
        uses: actions/upload-artifact@v7
        with:
          name: rpcemu-windows-arm64
          path: releases/windows/arm64/
          if-no-files-found: error

      # An artifact rather than a release asset, still - but for a smaller reason
      # than before. The boot test above means the runner now shows that RISC OS
      # boots and draws on this platform, not merely that the binary starts, so
      # what is left unproven is a person actually using it: sound, USB, a real
      # window on a real ARM laptop. This job uploads only the staged directory
      # while the amd64 job uploads its zip as well, so the release's *.zip glob
      # finds no arm64 asset. Publishing one is a matter of adding
      # releases/windows/*.zip to the path below, once somebody has run it in
      # anger.

  windows:
    needs: [windows-amd64, windows-arm64]
    if: always() && needs.windows-amd64.result == 'success' && needs.windows-arm64.result == 'success'
    runs-on: ubuntu-slim
    timeout-minutes: 3
    steps:
      - run: echo "Windows amd64 and arm64 both built and passed their tests."

  macos-x86_64:
    needs: build-gate
    if: always() && needs.build-gate.result == 'success'
    # Free Intel (macos-13) runners are effectively unavailable, so build the
    # x86_64 slice (WITH the dynarec) on an Apple Silicon runner: Apple clang
    # cross-compiles to x86_64 natively via CMAKE_OSX_ARCHITECTURES, we just
    # need x86_64 libraries (from a Rosetta x86_64 Homebrew - the arm64 Homebrew
    # in /opt/homebrew can't provide them) and Rosetta 2 to run the JIT test.
    runs-on: macos-14
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-tags: true

      - name: Install Rosetta 2
        run: softwareupdate --install-rosetta --agree-to-license

      - name: Install x86_64 Homebrew + dependencies
        timeout-minutes: 10
        run: |
          # A separate Intel Homebrew installs into /usr/local (the arm64
          # Homebrew lives in /opt/homebrew); both coexist. The install script
          # is downloaded by the outer shell, then executed under Rosetta so it
          # provisions the x86_64 tree.
          if [ ! -x /usr/local/bin/brew ]; then
            script="$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)"
            NONINTERACTIVE=1 arch -x86_64 /bin/bash -c "$script"
          fi
          # Both slices need the SAME version of every dependency: lipo fuses
          # them, and a library from two upstream releases is not one library.
          # The Intel and Apple Silicon Homebrews update independently, so
          # "brew update" is what holds them to one formula revision.
          # Retried because it fetches from github.com.
          for attempt in 1 2 3; do
            arch -x86_64 /usr/local/bin/brew update && break
            echo "brew update failed (attempt $attempt of 3)"
            [ "$attempt" = 3 ] && exit 1
            sleep $((attempt * 15))
          done
          arch -x86_64 /usr/local/bin/brew install cmake ninja pkg-config wxwidgets sdl2 libvncserver libusb
          echo "==> x86_64 dependency versions"
          arch -x86_64 /usr/local/bin/brew list --versions sdl2-compat sdl3 wxwidgets libvncserver libusb || true

      - name: Build x86_64 slice + test (Rosetta)
        timeout-minutes: 10
        run: |
          chmod +x build-macos.sh
          # Resolve wx-config / pkg-config / cmake from the x86_64 Homebrew
          # (/usr/local) so the slice links x86_64 libraries; clang emits x86_64
          # via CMAKE_OSX_ARCHITECTURES (set in build-macos.sh). The JIT test
          # binary is x86_64 and runs under Rosetta.
          export PATH="/usr/local/bin:$PATH"
          export PKG_CONFIG_PATH="/usr/local/lib/pkgconfig"
          ./build-macos.sh --arch x86_64

      - name: Upload x86_64 slice
        uses: actions/upload-artifact@v7
        with:
          name: macos-slice-x86_64
          # The staged tree, not just bin/: it carries this slice's bundled
          # dependencies, which only exist on this runner. The job that fuses the
          # slices installs no Homebrew packages of its own.
          path: build-mac-x86_64/appstage/
          if-no-files-found: error

  macos-arm64:
    needs: build-gate
    if: always() && needs.build-gate.result == 'success'
    # Apple Silicon runner: builds the arm64 slice, with the recompiler.
    #
    # It was the interpreter until 1.1.14 because the arm64 recompiler did not
    # boot (issue #30), which meant the machine most people run this on was
    # downloading the slow one. build-macos.sh decides that; this job just calls
    # it. The eight JIT differential tests build here now, checking the arm64
    # backend against the interpreter on the architecture it emits code for.
    runs-on: macos-14
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-tags: true

      - name: Install dependencies
        timeout-minutes: 3
        run: |
          # Both slices need the SAME version of every dependency: lipo fuses
          # them, and a library from two upstream releases is not one library.
          # The Intel and Apple Silicon Homebrews update independently, so
          # "brew update" is what holds them to one formula revision.
          #
          # Retried because it fetches from github.com. Still fatal if all three
          # attempts fail - the drift this prevents is worse than a red build.
          for attempt in 1 2 3; do
            brew update && break
            echo "brew update failed (attempt $attempt of 3)"
            [ "$attempt" = 3 ] && exit 1
            sleep $((attempt * 15))
          done
          brew install cmake ninja pkg-config wxwidgets sdl2 libvncserver libusb
          echo "==> arm64 dependency versions"
          brew list --versions sdl2-compat sdl3 wxwidgets libvncserver libusb || true

      - name: Build arm64 slice (recompiler) + test
        timeout-minutes: 3
        run: |
          chmod +x build-macos.sh
          ./build-macos.sh --arch arm64

      - name: Upload arm64 slice
        uses: actions/upload-artifact@v7
        with:
          name: macos-slice-arm64
          path: build-mac-arm64/appstage/
          if-no-files-found: error

  macos-universal:
    # Fuse the two per-arch slices into a universal binary and stage the release.
    needs: [macos-x86_64, macos-arm64]
    if: always() && needs.macos-x86_64.result == 'success' && needs.macos-arm64.result == 'success'
    runs-on: macos-14
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-tags: true

      - name: Download x86_64 slice
        uses: actions/download-artifact@v8
        with:
          name: macos-slice-x86_64
          path: build-mac-x86_64/appstage

      - name: Download arm64 slice
        uses: actions/download-artifact@v8
        with:
          name: macos-slice-arm64
          path: build-mac-arm64/appstage

      - name: Fuse (lipo) + build RPCEmu.app + DMG
        run: |
          chmod +x build-macos.sh
          ./build-macos.sh --fuse --zip

      - name: Smoke test app bundle
        run: |
          APP=releases/macos/RPCEmu.app
          MACOSD="$APP/Contents/MacOS"
          lipo -archs "$MACOSD/rpcemu"
          file "$MACOSD/rpcemu" | grep -i 'universal'
          test -f "$APP/Contents/Info.plist"
          codesign --verify --deep --strict "$APP"
          ls -la releases/macos/*.dmg

          # Every library the bundle needs must be inside the bundle or part of
          # macOS. This is the check that matters: the shipped .app was once
          # unlaunchable because its binaries still referred to Homebrew's own
          # prefix, which exists on the machine that built it and nowhere else.
          # Done by reading the load commands rather than by launching anything,
          # so it is deterministic and cannot hang.
          echo "==> checking every dependency resolves inside the bundle or in macOS"
          for f in "$MACOSD"/* "$APP/Contents/Frameworks"/*; do
            [ -f "$f" ] || continue
            file "$f" | grep -q Mach-O || continue
            # Only the indented lines are dependencies. otool prints a header
            # line per architecture for a universal binary, and for a library its
            # own install name as the first entry, so both are filtered out -
            # taking them for dependencies is what made the first version of this
            # check report every file as depending on itself.
            otool -L "$f" | grep -E '^[[:space:]]' | awk '{print $1}' | while read -r dep; do
              [ "$(basename "$dep")" = "$(basename "$f")" ] && continue
              case "$dep" in
                /usr/lib/*|/System/*) ;;                      # part of macOS
                @executable_path/*|@loader_path/*|@rpath/*) ;; # inside the bundle
                *)
                  echo "::error::$(basename "$f") depends on '$dep', which will not exist on another machine"
                  echo BAD >> dep-check.fail
                  ;;
              esac
            done
          done
          # The loop above runs in a subshell (pipe), so the failure is recorded
          # in a file rather than a variable.
          if [ -f dep-check.fail ]; then
            exit 1
          fi
          echo "✓ all dependencies are bundled or system"

      # The same command-line checks the Linux and Windows jobs run, on the
      # binary inside the bundle - which is what a user launches.
      - name: Command-line smoke test
        timeout-minutes: 3
        run: |
          bash tests/cli_smoke.sh releases/macos/RPCEmu.app/Contents/MacOS/rpcemu

      # Boot the machine for real and look at the screen - see the Linux job for
      # why. Run the binary inside the bundle, which is what a user launches,
      # so a boot that only fails when bundled is caught here.
      # The boot test needs a ROM, and RPCEmu ships none - so fetch one the way a
      # user now would, with the emulator's own downloader. That gives the boot
      # test something to run and checks the download itself on every platform,
      # which matters because each uses a different HTTP stack (libcurl here,
      # WinHTTP on Windows, NSURLSession on macOS).
      #
      # Cached, so RISC OS Open are not asked for the same file every push.
      # RPCEMU_DATADIR puts the ROM and the test machine under RUNNER_TEMP, so
      # every write stays out of the release about to be uploaded while the
      # binary still finds its resources beside itself.
      - name: Cache the RISC OS ROM
        uses: actions/cache@v6
        with:
          path: ci-rom
          key: rpcemu-rom-stable-v1
      - name: Fetch a ROM for the boot test
        run: |
          set -eu
          export RPCEMU_DATADIR="$RUNNER_TEMP/rpcemu-data"
          export RPCEMU_NO_GUI_MESSAGES=1
          # The bundle is the one layout where the read-only payload is not
          # beside the executable: it lives in Contents/Resources, while the
          # binary sits in Contents/MacOS. The emulator finds its resources by
          # looking for a directory holding configs/, and the data directory
          # created below has one, so it would otherwise settle on that and find
          # no poduleroms/ - leaving HostFS unavailable and !Boot unable to run.
          # Name the resource directory outright so the split is explicit.
          export RPCEMU_RESOURCE_DIR="$PWD/releases/macos/RPCEmu.app/Contents/Resources"
          mkdir -p "$RPCEMU_DATADIR" ci-rom
          cp -r default configs "$RPCEMU_DATADIR/"
          if ! ls ci-rom/ROM* >/dev/null 2>&1; then
            releases/macos/RPCEmu.app/Contents/MacOS/rpcemu \
              --fetch-riscos --no-disc --accept-licence
            cp "$RPCEMU_DATADIR"/roms/ROM* ci-rom/
          fi
          mkdir -p "$RPCEMU_DATADIR/roms"
          cp ci-rom/ROM* "$RPCEMU_DATADIR/roms/"
          ls -la "$RPCEMU_DATADIR/roms/"

      - name: Headless boot smoke test
        timeout-minutes: 3
        run: |
          # See the fetch step: the bundle keeps its read-only payload in
          # Contents/Resources, so that has to be named rather than found.
          export RPCEMU_RESOURCE_DIR="$PWD/releases/macos/RPCEmu.app/Contents/Resources"
          python3 tests/boot_smoke.py \
            --binary releases/macos/RPCEmu.app/Contents/MacOS/rpcemu \
            --datadir "$RUNNER_TEMP/rpcemu-data" \
            --abort-check require \
            --save vnc-smoke-macos-universal.png

      - name: Upload the boot screenshot
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: vnc-smoke-macos-universal
          path: vnc-smoke-macos-universal.png
          # A single PNG: skip the zip so it can be viewed from the run page
          # directly. "archive: false" allows one file only, which this is.
          archive: false
          if-no-files-found: ignore

      - name: Upload macOS universal release
        uses: actions/upload-artifact@v7
        with:
          name: rpcemu-macos-universal
          path: |
            releases/macos/*.dmg
            releases/macos/*.tar.gz
          if-no-files-found: error

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    # The sanitiser job gates a release too. It is the only thing that looks at
    # whether the emulator's C is well defined rather than merely producing the
    # expected answer, and shipping past a report from it would mean shipping
    # something known to be relying on the compiler's goodwill.
    needs: [release-preflight, sanitisers, interface-docs, linux, windows, macos-universal]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      # The notes come from the file release-preflight insisted on, so the
      # release reads correctly the moment it appears.
      - uses: actions/checkout@v7

      - name: Download all build artifacts
        uses: actions/download-artifact@v8
        with:
          path: upload

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          body_path: docs/release-notes/${{ github.ref_name }}.md
          files: |
            upload/**/*.deb
            upload/**/*.dmg
            upload/**/*.tar.gz
            upload/**/*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Tell a Slack channel when CI has something worth saying, which is not most
  # of the time. A channel that receives a green tick for every push stops being
  # read, and then the red one is missed as well, so this posts three things:
  # a build that broke, the build that fixed it, and a release going out.
  #
  # Pushes only. A pull request from a fork cannot read repository secrets, so a
  # notification step there would silently do nothing on exactly the runs an
  # outside contributor most wants feedback on, and look configured while doing
  # it. The PR's own checks report to the PR, which is where that conversation
  # already is.
  #
  # Nothing here fails the build. A workflow that goes red because Slack was
  # unreachable would be reporting on itself rather than on the emulator.
  notify:
    if: always() && github.event_name == 'push'
    # Every job that can fail is listed, because this one works its verdict out
    # from toJSON(needs) and a job missing from the list is one whose failures
    # nobody is told about: the run goes red and the channel says nothing, which
    # is the silent failure this file exists to avoid.
    #
    # In particular the jobs that only feed an aggregate are listed individually.
    # A failed macos-x86_64 leaves macos-universal *skipped* rather than failed,
    # and a skip is not a failure to the check below, so naming only the
    # aggregate would have announced a green build for a run that was red. The
    # same goes for the two Linux and two Windows jobs behind their aggregates.
    #
    # The gates are not listed. build-gate and the aggregates report which tier
    # stopped rather than what broke, and every job behind them is named here
    # already, so including them would only replace a useful name with a vague
    # one.
    needs:
      - release-preflight
      - sanitisers
      - interface-docs
      - mcp-server
      - linux-amd64
      - linux-arm64
      - windows-amd64
      - windows-arm64
      - macos-x86_64
      - macos-arm64
      - macos-universal
      - release
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read   # to read whether the previous run was red
    steps:
      - name: Work out whether there is anything to say
        id: verdict
        env:
          GH_TOKEN: ${{ github.token }}
          RESULTS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail

          # A job that did not run is not a job that failed: release-preflight and
          # release are skipped on every push that is not a tag, and a failed
          # preflight skips everything behind it.
          failed=$(printf '%s' "$RESULTS" \
              | jq -r 'to_entries | map(select(.value.result == "failure") | .key) | join(", ")')

          # Cancelled is neither a pass nor a failure, and needs saying as its
          # own state rather than falling through to one of them. The
          # concurrency group above cancels superseded runs as a matter of
          # course, so treating cancelled as passed would announce a green
          # build for a commit nobody waited on and that was never finished.
          cancelled=$(printf '%s' "$RESULTS" \
              | jq -r 'to_entries | map(select(.value.result == "cancelled") | .key) | join(", ")')

          if [ -n "$failed" ]; then
            state=failed
          elif [ -n "$cancelled" ]; then
            state=cancelled
          else
            state=passed
          fi

          # Was the last completed run of this workflow on this ref red? That is
          # what makes a green run worth announcing, and there is no other way to
          # know it from inside the run. Tags have no previous run to compare
          # against, each being its own ref, so the question is only asked for
          # branches.
          previous=none
          if [ "${GITHUB_REF_TYPE}" = "branch" ]; then
            previous=$(gh api \
                "repos/${GITHUB_REPOSITORY}/actions/workflows/build.yml/runs?branch=${GITHUB_REF_NAME}&event=push&status=completed&per_page=5" \
                --jq "[.workflow_runs[] | select(.id != ${GITHUB_RUN_ID})] | .[0].conclusion // \"none\"" \
                2>/dev/null || echo none)
          fi

          # Every completed push is reported, so the channel shows that CI is
          # running rather than only that it once broke. A recovery still reads
          # differently from an ordinary green run: coming back from red is the
          # one green result anybody is waiting for.
          post=false
          case "$state:$previous" in
            failed:*)       post=true; kind=broken ;;
            passed:failure) post=true; kind=fixed ;;
            passed:*)       post=true; kind=passed ;;
            *)              kind=quiet ;;   # cancelled
          esac

          # A release going out is worth saying whatever the previous run did.
          if [ "${GITHUB_REF_TYPE}" = "tag" ] && [ "$state" = passed ]; then
            post=true
            kind=released
          fi

          {
            echo "post=$post"
            echo "kind=$kind"
            echo "failed=$failed"
          } >> "$GITHUB_OUTPUT"

          echo "state=$state previous=$previous kind=$kind post=$post"

      - name: Post to Slack
        if: steps.verdict.outputs.post == 'true'
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          KIND: ${{ steps.verdict.outputs.kind }}
          FAILED: ${{ steps.verdict.outputs.failed }}
          SUBJECT: ${{ github.event.head_commit.message }}
        run: |
          set -uo pipefail

          # Not configured is not an error: a fork, or a clone of this repository
          # by somebody who has no Slack, should build exactly as it does now.
          if [ -z "${SLACK_WEBHOOK_URL:-}" ]; then
            echo "No SLACK_WEBHOOK_URL secret is set, so nothing was posted."
            exit 0
          fi

          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          subject=$(printf '%s' "${SUBJECT:-}" | head -n1)
          short="${GITHUB_SHA:0:7}"

          # printf, not a double-quoted string: a "\n" written into one of those
          # stays two characters all the way to Slack, which then shows it as
          # two characters. The escapes have to be interpreted by something, and
          # doing it in the format string keeps every piece of outside text in a
          # %s where it cannot be read as an escape of its own.
          case "$KIND" in
            broken)
              text=$(printf ':red_circle: *CI is red on `%s`*\nFailed: %s\n<%s|View the run> | `%s` %s\nPushed by %s' \
                  "$GITHUB_REF_NAME" "$FAILED" "$run_url" "$short" "$subject" "$GITHUB_ACTOR")
              ;;
            fixed)
              text=$(printf ':large_green_circle: *CI is green again on `%s`*\n<%s|View the run> | `%s` %s\nFixed by %s' \
                  "$GITHUB_REF_NAME" "$run_url" "$short" "$subject" "$GITHUB_ACTOR")
              ;;
            passed)
              text=$(printf ':white_check_mark: *CI passed on `%s`* | `%s` %s\n<%s|View the run> | %s' \
                  "$GITHUB_REF_NAME" "$short" "$subject" "$run_url" "$GITHUB_ACTOR")
              ;;
            released)
              text=$(printf ':package: *RPCEmu %s has been released*\n<%s/%s/releases/tag/%s|Release page> | <%s|Build log>' \
                  "$GITHUB_REF_NAME" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_REF_NAME" "$run_url")
              ;;
            *)
              echo "Nothing to say."
              exit 0
              ;;
          esac

          # jq builds the JSON so a commit message containing a quote, a
          # backslash or a newline cannot break the payload.
          payload=$(jq -n --arg text "$text" '{text: $text}')

          code=$(curl -sS -o /tmp/slack.out -w '%{http_code}' \
              -X POST -H 'Content-type: application/json' \
              --data "$payload" "$SLACK_WEBHOOK_URL" || echo 000)

          if [ "$code" != "200" ]; then
            echo "Slack returned $code: $(cat /tmp/slack.out)"
            echo "Not failing the build over it."
          else
            echo "Posted to Slack ($KIND)."
          fi
